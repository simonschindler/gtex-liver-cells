[project]
name = "gtex-liver-cells"
version = "0.1.0"
description = "Build a cell-resolved GTEx liver histopathology dataset from public data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anndata>=0.13.2",
    "geopandas>=1.1.4",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.15.19"]

[tool.ruff]
target-version = "py314"
line-length = 100
